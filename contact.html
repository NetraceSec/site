<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Netrace Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #9ca3af; }
        h1, h2, h3, h4, .brand-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white min-h-screen flex flex-col justify-between bg-[#0b0f19] text-gray-300">

    <header class="sticky top-0 z-50 bg-[#0b0f19]/90 backdrop-blur-xl border-b border-white/10 w-full">
        <nav class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex justify-between items-center">
            <a href="index.html" class="brand-font text-xl font-extrabold tracking-wider text-white uppercase">
                NETRACE <span class="text-sky-400 font-normal text-sm tracking-widest border-l border-white/20 pl-2">SECURITY</span>
            </a>
            
            <div class="hidden md:flex items-center space-x-8 text-xs font-semibold tracking-widest uppercase text-gray-300">
                <a href="index.html" class="hover:text-sky-400 transition">Home</a>
                <a href="services.html" class="hover:text-sky-400 transition">Services</a>
                <a href="portfolio.html" class="hover:text-sky-400 transition">Portfolio & CVEs</a>
                <a href="about.html" class="hover:text-sky-400 transition">About</a>
                <a href="contact.html" class="text-sky-400 font-bold border-b-2 border-sky-400 pb-1">Contact</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow py-20 max-w-3xl mx-auto px-6 lg:px-8">
        <div class="text-center mb-12 space-y-3">
            <span class="text-xs font-semibold uppercase tracking-widest text-sky-400 bg-sky-500/10 px-3 py-1 rounded-full border border-sky-500/20">Scoping & Advisory</span>
            <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight">Initiate an Inquire</h1>
            <p class="text-gray-400">Request a scoping conversation or advisory call.</p>
        </div>

        <form action="#" method="POST" class="space-y-6 border border-white/10 p-8 sm:p-10 bg-white/[0.02] rounded-3xl backdrop-blur-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 bg-[#0b0f19] border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400 transition">
                </div>
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Email</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-3 bg-[#0b0f19] border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400 transition">
                </div>
            </div>

            <div>
                <label for="package" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Area of Focus</label>
                <select id="package" name="package" class="w-full px-4 py-3 bg-[#0b0f19] border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400 transition">
                    <option value="">Select Focus Area...</option>
                    <option value="AppSec & API Pentesting">Web App & API Security Pentest</option>
                    <option value="AI / LLM Security">AI & LLM Red Teaming</option>
                    <option value="Cloud & IAM">Cloud Architecture & IAM Escalation</option>
                    <option value="CI/CD Supply Chain">CI/CD Pipeline Security</option>
                    <option value="Retainer">Continuous Advisory Retainer</option>
                </select>
            </div>

            <div>
                <label for="message" class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Scope Overview</label>
                <textarea id="message" name="message" rows="4" required class="w-full px-4 py-3 bg-[#0b0f19] border border-white/10 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400 transition" placeholder="Provide details on your scope, application architecture, or timelines..."></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs uppercase tracking-widest transition rounded-xl shadow-lg shadow-sky-500/20">
                Submit Inquiry
            </button>
        </form>

        <div class="text-center mt-10">
            <p class="text-sm text-gray-400">Encrypted Email: <a href="mailto:netracesec@proton.me" class="text-sky-400 font-mono hover:underline">netracesec@proton.me</a></p>
        </div>
    </main>

    <footer class="py-10 border-t border-white/10 bg-[#0b0f19] w-full text-center text-xs text-gray-500">
        &copy; Netrace Security. All rights reserved.
    </footer>
</body>
</html>
